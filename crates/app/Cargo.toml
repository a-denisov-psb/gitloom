[package]
name = "gitloom"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
git-core = { path = "../git-core" }
git-graph = { path = "../git-graph" }
iced = { version = "0.14.0", features = ["canvas", "advanced", "tokio"] }
directories = "6.0"
notify = "8.2"
rfd = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["rt", "time"] }

[dev-dependencies]
git-core = { path = "../git-core", features = ["mock"] }
tempfile = "3.27"

[lints]
workspace = true
