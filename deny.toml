# cargo-deny configuration (M6-03, ADR-008).
# Run: `cargo deny check` (part of ./scripts/check.sh when installed, and of CI).

[graph]
all-features = false

[advisories]
# Unmaintained crates deep in the iced/wgpu tree are reported, not fatal;
# vulnerabilities are always errors.
unmaintained = "workspace"
ignore = []

[licenses]
# Every license must be compatible with GPL-3.0-or-later. Each entry was
# checked against the dependency tree (`cargo deny list`) of 2026-11-06.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# iced, wgpu and winit pull in several major versions of some crates.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
