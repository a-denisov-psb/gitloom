name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the About dialog (command palette → "About").
      placeholder: "1.0.0 (commit abc1234567)"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version and package
      placeholder: "Windows 11 23H2, msi / Ubuntu 24.04, AppImage / macOS 15, dmg"
  - type: input
    id: git-version
    attributes:
      label: Git version
      description: Output of `git --version`.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: crash-report
    attributes:
      label: Crash report
      description: If Gitloom crashed, the next start offers "Copy report" in the status bar. Paste it here (it contains no repository contents; check the message line for paths you do not want to share).
      render: text
